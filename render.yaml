# Render blueprint: New > Blueprint > pick this repo. Values marked "sync: false" are asked for
# when the blueprint is created (see README "Deploy to Render").
services:
  - type: web
    name: als-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Requests arrive through Vercel and then Render's own proxy
      - key: TRUST_PROXY
        value: "2"
      - key: MONGO_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # The MQTT broker is entered on the website (Settings → MQTT broker). Setting MQTT_URL,
      # MQTT_USERNAME, MQTT_PASSWORD, MQTT_DEVICE_USERNAME, MQTT_DEVICE_PASSWORD here instead also works.
